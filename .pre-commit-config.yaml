# Run `pre-commit install` once to enable these hooks locally.
# They mirror the checks in .github/workflows/ci.yml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Lint (and auto-fix what it safely can).
      - id: ruff
        args: [--fix]
      # Formatting — same as `ruff format --check` in CI.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # uv.lock is intentionally committed and exceeds the 500 KB default.
        args: [--maxkb=1024]
      - id: check-merge-conflict
