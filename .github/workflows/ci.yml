name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.12

      # No system MPI is installed deliberately.  `mpi4py` comes from the `embed` extra
      # as a self-contained wheel, which imports and runs single-rank without one, and
      # `ipc.rank0_solve` degrades to a plain solve when mpi4py is absent or unused.  The
      # two tests in tests/test_mpi.py need an `mpirun`, so without one they skip -- which
      # is what we want here: this runner cannot form a multi-rank COMM_WORLD (see the MPI
      # note in PR_SUMMARY.md), so installing a launcher only buys a red build no source
      # change can fix.  Run them locally, where MPI works.
      - name: Install project
        run: uv pip install -e ".[dev,quantum,fermions,relabel,hardware,embed]"

      - name: Check formatting (ruff)
        run: uv run ruff format --check src tests

      - name: Lint (ruff)
        run: uv run ruff check src tests

      # EMBASI_AVAILABLE=1 un-skips the `embasi`-marked tests, which need the `embed`
      # extra installed above.  They are PySCF-backed, so they need no FHI-aims binary.
      #
      # `timeout-minutes` bounds the step explicitly: the suite runs in ~5 min, so 30 is
      # generous, and a hang is then reported as a timeout rather than the job's 6-hour
      # default.  `-ra` makes the short summary list every non-pass outcome, so a run that
      # dies mid-way still says which tests had started.
      - name: Run unit tests
        timeout-minutes: 30
        run: uv run pytest -q -ra
        env:
          EMBASI_AVAILABLE: "1"

      # The `embasi` marker is deselected by the addopts in pyproject.toml, so the run
      # above never collects it; -m embasi selects exactly that set.
      - name: Run EmbASI-backed tests
        timeout-minutes: 15
        run: uv run pytest -q -ra -m embasi
        env:
          EMBASI_AVAILABLE: "1"
