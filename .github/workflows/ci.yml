name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.12

      # No system MPI (no apt libmpich/openmpi): `mpi4py` arrives with the `embed` extra as
      # a self-contained wheel and works single-rank without one, which is all EmbASI needs
      # -- it imports mpi4py at module scope, so the extra cannot be had without it.  What a
      # system MPI would add is a `mpirun` launcher, and this runner could not form a
      # multi-rank COMM_WORLD however it was provided; tests/test_mpi.py therefore skips
      # (no launcher) while everything EmbASI-backed runs.
      - name: Install project
        run: uv pip install -e ".[dev,quantum,fermions,relabel,hardware,embed]"

      - name: Check formatting (ruff)
        run: uv run ruff format --check src tests

      - name: Lint (ruff)
        run: uv run ruff check src tests

      # EMBASI_AVAILABLE=1 un-skips the `embasi`-marked tests; they are PySCF-backed, so
      # they need no FHI-aims binary and no system MPI.  `addopts` deselects that marker, so
      # the second step selects it explicitly.  `timeout-minutes` bounds each step so a hang
      # is reported as a timeout rather than inheriting the job's 6-hour default, and `-ra`
      # lists every non-pass outcome.
      - name: Run unit tests
        timeout-minutes: 30
        run: uv run pytest -q -ra
        env:
          EMBASI_AVAILABLE: "1"

      - name: Run EmbASI-backed tests
        timeout-minutes: 15
        run: uv run pytest -q -ra -m embasi
        env:
          EMBASI_AVAILABLE: "1"
